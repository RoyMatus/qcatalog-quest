<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1280" height="800" rx="24" fill="#F5F3EF"/><rect x="0" y="0" width="248" height="800" rx="24" fill="#FFFEFC"/><text x="32" y="64" font-size="32" fill="#172234">QCatalog</text><text x="280" y="64" font-size="32" fill="#172234">Загрузки · нужна проверка</text><g transform="translate(32 134) scale(1.16)" fill="none" stroke="#172234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8H18L21 17H17L14 14H10L7 17H3Z M7 10V14 M5 12H9 M16 11H16.1 M18 13H18.1"/></g><text x="76" y="157" font-size="22" fill="#172234">Каталог</text><g transform="translate(32 222) scale(1.16)" fill="none" stroke="#172234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4H10L12 6L14 4H21V20H14L12 22L10 20H3Z M12 6V22"/></g><text x="76" y="245" font-size="22" fill="#172234">Библиотека</text><rect x="16" y="288" width="216" height="72" rx="16" fill="#D9EBFA"/><g transform="translate(32 310) scale(1.16)" fill="none" stroke="#172234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3V15 M7 10L12 15L17 10 M4 17V21H20V17"/></g><text x="76" y="333" font-size="22" fill="#172234">Загрузки</text><g transform="translate(32 398) scale(1.16)" fill="none" stroke="#172234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8A8 8 0 0 0 6 5L3 8 M3 3V8H8 M4 16A8 8 0 0 0 14 21L21 16 M16 16H21V21"/></g><text x="76" y="421" font-size="22" fill="#172234">Обновления</text><g transform="translate(32 720) scale(1.16)" fill="none" stroke="#172234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 5L19 5L19 9L22 12L19 15L19 19L15 19L12 22L9 19L5 19L5 15L2 12L5 9L5 5L9 5Z M15 12A3 3 0 1 1 9 12A3 3 0 1 1 15 12"/></g><text x="76" y="744" font-size="22" fill="#172234">Настройки</text><rect x="280" y="112" width="968" height="300" rx="20" fill="#FCEBED"/><g transform="translate(312 144) scale(1.16)" fill="none" stroke="#172234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L22 21H2Z M12 9V14 M12 17V18"/></g><text x="360" y="168" font-size="26" fill="#172234">Beat Saber</text><text x="312" y="222" font-size="26" fill="#B42332">Не удалось установить</text><text x="312" y="264" font-size="22" fill="#172234">Файлы сохранены — можно повторить установку.</text><rect x="312" y="304" width="240" height="64" rx="16" fill="#075FC7"/><text x="336" y="344" font-size="22" fill="#FFFFFF">Повторить</text><rect x="576" y="304" width="240" height="64" rx="16" fill="#ECEAE6"/><text x="600" y="344" font-size="22" fill="#172234">Подробнее</text><rect x="280" y="460" width="968" height="252" rx="20" fill="#FFFEFC"/><text x="312" y="508" font-size="22" fill="#172234">Если обновление установлено, но очистка не удалась</text><text x="312" y="552" font-size="20" fill="#485568">Игра обновлена. Установочные файлы ещё занимают место.</text><rect x="312" y="596" width="320" height="64" rx="16" fill="#075FC7"/><text x="336" y="636" font-size="22" fill="#FFFFFF">Повторить очистку</text></g></svg>